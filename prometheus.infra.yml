global:
  scrape_interval: 15s

scrape_configs:
  - job_name: users-service
    static_configs:
      - targets: ["host.docker.internal:5001"]
    metrics_path: /metrics

  - job_name: events-service
    static_configs:
      - targets: ["host.docker.internal:5002"]
    metrics_path: /metrics

  - job_name: bookings-service
    static_configs:
      - targets: ["host.docker.internal:5003"]
    metrics_path: /metrics